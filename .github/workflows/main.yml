name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        env:
          APP_ENV: test
          API_SECRET_TOKEN: ci-test-api-secret-token-1234567890
          APPROVAL_HMAC_SECRET: ci-test-approval-hmac-secret-1234567890
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm test

      - name: Build Next.js production bundle
        env:
          API_SECRET_TOKEN: ci-test-api-secret-token-1234567890
          BACKEND_INTERNAL_URL: http://127.0.0.1:8005
          NEXT_PUBLIC_APP_DOMAIN: https://gemuse.zyuuuukak1n.dev
        run: npm run build

  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: |
          cp .env.example .env
          docker compose config -q

