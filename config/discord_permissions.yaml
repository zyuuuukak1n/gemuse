# Discord Server-by-Server Permission Whitelist (Step 2)
# Supported permission levels:
#   - disabled: block all reads and writes
#   - read_only: allow channel listing, history reading, and search; physically block all writes
#   - read_write: allow reads plus posting & pinned summary edits (with valid ApprovalService token)
version: "1.0.0"
default_policy: disabled

servers: []
  # Example:
  # - guild_id: "123456789012345678"
  #   name: "Personal Workspace"
  #   permission: "read_only"
  #   allowed_channels:
  #     - "987654321098765432"
